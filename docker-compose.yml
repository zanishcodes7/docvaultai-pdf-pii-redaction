services:
  floci:
    image: hectorvent/floci:latest
    container_name: docuvault-aws-emulator
    ports:
      - "4566:4566"
    volumes:
      - floci_data:/data

  postgres:
    image: postgres:17-alpine
    container_name: docuvault-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=docuvault
      - POSTGRES_PASSWORD=docuvault_pass
      - POSTGRES_DB=docuvault_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  floci_data:
  postgres_data: